services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-whatsapp_crm}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_APP_ID: ${WHATSAPP_APP_ID}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      GCS_ACCESS_KEY_ID: ${GCS_ACCESS_KEY_ID}
      GCS_SECRET_ACCESS_KEY: ${GCS_SECRET_ACCESS_KEY}
      GCS_REGION: ${GCS_REGION:-auto}
      GCS_BUCKET: ${GCS_BUCKET}
      GCS_ENDPOINT: ${GCS_ENDPOINT:-https://storage.googleapis.com}
      GCS_FOLDER_PREFIX: ${GCS_FOLDER_PREFIX:-Waku/messages}
      CSAT_LINK_PENILAIAN_KONFIRMASI_URL: ${CSAT_LINK_PENILAIAN_KONFIRMASI_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
